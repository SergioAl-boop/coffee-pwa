<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del café</title>
    <link rel="stylesheet" href="css/detalle.css">
</head>

<body>

    <main class="detalle-container">

        <a href="index.html" class="volver">← Volver</a>

        <div class="detalle-card">

            <div class="detalle-imagen">
                <img id="cafe-imagen" src="" alt="">
            </div>

            <div class="detalle-info">

                <h1 id="cafe-nombre"></h1>

                <p id="cafe-descripcion" class="descripcion"></p>

                <div class="datos-cafe">
                    <p><strong>Precio:</strong> <span id="cafe-precio"></span></p>
                    <p><strong>Origen:</strong> <span id="cafe-origen"></span></p>
                    <p><strong>Ingredientes:</strong> <span id="cafe-ingredientes"></span></p>
                    <p><strong>Sabor:</strong> <span id="cafe-sabor"></span></p>
                    <p><strong>Preparación:</strong> <span id="cafe-preparacion"></span></p>
                    <p><strong>Tamaño:</strong> <span id="cafe-tamano"></span></p>
                </div>

            </div>

        </div>

    </main>

    <script src="js\detalle.js"></script>

</body>
</html>
